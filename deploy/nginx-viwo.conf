# =============================================================================
# ViWo nginx config — installed at /etc/nginx/conf.d/viwo.conf
# =============================================================================
#
# Two virtual hosts on the same EC2 host (35.171.47.212):
#   - viwoapp.com / www.viwoapp.com → main Mini App SPA
#   - viwoapp.org / www.viwoapp.org → admin panel SPA
#
# Both share the same backend at /api/. The backend distinguishes admin
# routes (/api/v1/admin/*) from coupon routes (/api/v1/coupon/*) internally.
#
# After updating this file on the server, run certbot to add SSL for the
# new viwoapp.org host (the viwoapp.com cert already exists):
#
#   sudo certbot --nginx -d viwoapp.org -d www.viwoapp.org
#
# Certbot will rewrite this file in place to add `listen 443 ssl;` blocks
# and HTTP→HTTPS redirects, keeping the upstream proxy_pass directives.

# ────────────────────────────────────────────────────────────────────────────
# Main app — viwoapp.com
# ────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name viwoapp.com www.viwoapp.com;

    # Mini App SPA
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API (shared with admin)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health check (bypass Nginx for monitoring)
    location /health {
        proxy_pass http://127.0.0.1:8080;
    }
}

# ────────────────────────────────────────────────────────────────────────────
# Admin panel — viwoapp.org
# ────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name viwoapp.org www.viwoapp.org;

    # Admin SPA — served from the admin docker container on internal :3001
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API — same backend as the main app, only the admin routes
    # (/api/v1/admin/*) are reachable in practice. The backend's RBAC
    # middleware enforces access control.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8080;
    }
}
